name: Validate Control Studio UI
on:
  push:
    branches: [main]
    paths: ['shared/**', 'tests/ui/**', '.github/workflows/ui.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check shared/client-style.js
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/ui/studio.cjs
