name: Validate Control Studio UI
on:
  push:
    branches: [main]
    paths: ['shared/**', 'tests/ui/**', '.github/workflows/ui.yml']
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check shared/client-style.js
