name: Build Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', 'shared/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$MANAGER"
          "$MANAGER" --sdk_root="$SDK" 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
      - run: |
          mkdir -p android/app/src/main/assets
          cp shared/client-style.js android/app/src/main/assets/client-style.js
          mkdir -p android/app/src/main/res/drawable-nodpi
          cp ios/icon.png android/app/src/main/res/drawable-nodpi/polder_brand.png
      - run: gradle -p android :app:assembleDebug :app:lintDebug
      - name: Show lint report on failure
        if: failure()
        run: |
          find android/app/build -name 'lint-results-debug.txt' -exec cat {} \; || true
      - run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk PolderSMP.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose PolderSMP.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PolderSMP-Android
          path: PolderSMP.apk
          if-no-files-found: error
          retention-days: 7
