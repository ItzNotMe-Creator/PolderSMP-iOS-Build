name: Validate Atlas UI
on:
  push:
    branches: [main]
    paths: ['shared/**', 'tests/ui/**', '.github/workflows/ui.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check shared/client-style.js
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/ui/studio.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Atlas-preview
          path: preview/*.png
          retention-days: 7
          if-no-files-found: warn
